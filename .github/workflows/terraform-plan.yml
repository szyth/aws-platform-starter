name: terraform-plan

# Runs on every pull request: format check, validate, and plan.
# Auth is via GitHub OIDC; there are NO AWS keys stored in GitHub.
on:
  pull_request:
    paths: ["envs/**", "modules/**"]

permissions:
  id-token: write # required to request the OIDC token
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@v3

      - run: terraform fmt -check -recursive ../..

      - run: >
          terraform init
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=envs/dev/terraform.tfstate"
          -backend-config="region=ap-south-1"
          -backend-config="use_lockfile=true"

      - run: terraform validate

      - run: >
          terraform plan -input=false
          -var="github_repo=${{ github.repository }}"
          -var="state_bucket_name=${{ vars.TF_STATE_BUCKET }}"
          -var="app_github_repo=${{ github.repository_owner }}/rust-backend-starter"
          -var="github_owner_id=${{ github.repository_owner_id }}"
